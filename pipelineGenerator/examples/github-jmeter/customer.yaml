incomplete: false
setup:
  id: github-actions-jmeter-storefront
  generation_mode: both
cicd:
  type: github_actions
tool:
  type: jmeter
  connection:
    test_plan_path: performance/checkout.jmx
    jmeter_bin: ''
manual_pipeline:
  enabled: true
  name: JMeter Manual Run
  timeout_minutes: 120
automated_jobs:
- name: post-deploy-smoke
  enabled: true
  environment_ref: qa
  scenario_ref: checkout_smoke
  timeout_minutes: 45
catalog:
  environments:
  - key: qa
    identifier: env-qa
  scenarios:
  - key: checkout_smoke
    identifier: checkout-smoke
pre_run_checks:
- verify_scenario_exists
readme:
  include_manual_usage: true
  include_automated_usage: true
