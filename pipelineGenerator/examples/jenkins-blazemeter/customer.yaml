version: 1
incomplete: false
setup:
  id: jenkins-blazemeter-storefront
  working_location: central_repo
  final_pipeline_destination: copy_to_customer_repo
  ci_can_use_central_repo_directly: false
  target_repository: github.com/acme/storefront
  generation_mode: both
cicd:
  type: jenkins
tool:
  type: blazemeter
  auth:
    type: api_token
  connection:
    base_url: https://a.blazemeter.com
    workspace_id: "12345"
    project_id: "67890"
manual_pipeline:
  enabled: true
  name: Jenkins BlazeMeter Manual Run
  timeout_minutes: 180
automated_jobs:
  - name: post-deploy-smoke
    enabled: true
    environment_ref: qa
    scenario_ref: qa_smoke_qa
    timeout_minutes: 60
catalog:
  environments:
    - key: qa
      name: QA
      identifier: QA
  scenarios:
    - key: qa_smoke_qa
      name: QA Smoke (QA)
      identifier: "3344556"
pre_run_checks:
  - verify_host_reachable
  - verify_project_exists
  - verify_scenario_exists
  - collect_results
artifacts:
  download_remote_results: true
  fail_on_partial_download: false
readme:
  include_manual_usage: true
  include_automated_usage: true
