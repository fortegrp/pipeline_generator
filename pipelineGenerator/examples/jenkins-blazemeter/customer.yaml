incomplete: false
setup:
  id: jenkins-blazemeter-storefront
  generation_mode: both
cicd:
  type: jenkins
tool:
  type: blazemeter
  connection:
    base_url: https://a.blazemeter.com
    workspace_id: '12345'
    project_id: '67890'
manual_pipeline:
  enabled: true
  name: Jenkins BlazeMeter Manual Run
  timeout_minutes: 180
automated_jobs:
- name: post-deploy-smoke
  enabled: true
  environment_ref: qa
  scenario_ref: qa_smoke_qa
  timeout_minutes: 60
catalog:
  environments:
  - key: qa
    identifier: QA
  scenarios:
  - key: qa_smoke_qa
    identifier: '3344556'
pre_run_checks:
- verify_host_reachable
- verify_project_exists
- verify_scenario_exists
readme:
  include_manual_usage: true
  include_automated_usage: true
