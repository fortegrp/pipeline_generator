incomplete: false
setup:
  id: azure-devops-jmeter-storefront
  generation_mode: both
cicd:
  type: azure_devops
tool:
  type: jmeter
  connection:
    test_plan_path: performance/checkout.jmx
    jmeter_bin: ''
manual_pipeline:
  enabled: true
  name: Azure JMeter Manual Run
  timeout_minutes: 90
automated_jobs:
- name: post-deploy-smoke
  enabled: true
  environment_ref: qa
  scenario_ref: qa_smoke
  timeout_minutes: 45
catalog:
  environments:
  - key: qa
    identifier: env-qa
  scenarios:
  - key: qa_smoke
    identifier: checkout-smoke
pre_run_checks:
- verify_scenario_exists
readme:
  include_manual_usage: true
  include_automated_usage: true
