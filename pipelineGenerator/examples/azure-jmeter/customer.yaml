incomplete: false
setup:
  id: azure-devops-jmeter-storefront
  generation_mode: both
cicd:
  type: azure_devops
tool:
  type: jmeter
  connection:
    test_plan_path: performance/checkout.jmx
    docker_image: ''
manual_pipeline:
  enabled: true
  name: Azure JMeter Manual Run
  timeout_minutes: 90
automated_jobs:
- name: post-deploy-smoke
  enabled: true
  environment_ref: qa
  scenario_ref: qa_smoke
  timeout_minutes: 45
catalog:
  environments:
  - key: qa
    identifier: env-qa
    scenarios:
    - key: qa_smoke
      identifier: checkout-smoke
pre_run_checks:
- verify_scenario_exists
- verify_docker_available
readme:
  include_manual_usage: true
  include_automated_usage: true
load_profile:
  test_type: load
  users: 20
  ramp_up_seconds: 60
  duration_minutes: 10
  throughput_rps: 0
