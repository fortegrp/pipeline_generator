name: Pipeline Generator CI

on:
  push:
    branches: [main]
    paths:
      - "pipelineGenerator/**"
      - ".github/workflows/pipeline-generator-ci.yml"
  pull_request:
    paths:
      - "pipelineGenerator/**"
      - ".github/workflows/pipeline-generator-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelineGenerator
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest
