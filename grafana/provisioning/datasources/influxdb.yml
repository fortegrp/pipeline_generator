apiVersion: 1

datasources:
  - name: InfluxDB Performance
    type: influxdb
    access: proxy
    uid: influxdb-performance
    url: http://influxdb:8086
    isDefault: true
    editable: false
    jsonData:
      version: Flux
      organization: ${INFLUXDB_ORG}
      defaultBucket: ${INFLUXDB_BUCKET}
    secureJsonData:
      token: ${INFLUXDB_TOKEN}
